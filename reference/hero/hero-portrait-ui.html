<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juan Perozo · Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F3F0; --fg:#14151A; --muted:#4A4B52; --line:#D9D9D3; --accent:#2A3FFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E0F12; --fg:#ECECEE; --muted:#B5B7BD; --line:#2A2C32; --accent:#8C9BFF; }
}
:root[data-theme="dark"]{ --bg:#0E0F12; --fg:#ECECEE; --muted:#B5B7BD; --line:#2A2C32; --accent:#8C9BFF; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:8px; }

.stage{ position:relative; height:100vh; height:100svh; min-height:560px; overflow:hidden; touch-action:pan-y; }
canvas#c{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; }

.top{ position:absolute; z-index:6; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; gap:16px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,4.5vw) 0; }
.brand{ font-size:20px; font-weight:800; letter-spacing:-0.03em; }
.top nav{ display:flex; align-items:center; gap:26px; font-size:15px; font-weight:500; }
.top nav a:hover{ color:var(--accent); }
.pill{ display:inline-flex; align-items:center; min-height:44px; padding:0 22px; border-radius:999px; background:var(--fg); color:var(--bg); font-weight:600; font-size:15px; }
.top nav a.pill:hover{ color:var(--bg); opacity:.85; }

.copy{ position:absolute; z-index:4; inset:0; display:flex; align-items:center; padding:0 max(24px,4.5vw); pointer-events:none; }
.copy-inner{ max-width:min(560px,36vw); pointer-events:auto; }
.copy h1{ margin:0 0 22px; font-size:clamp(40px,5.2vw,84px); line-height:1; letter-spacing:-0.045em; font-weight:800; }
.copy p{ margin:0 0 30px; max-width:400px; font-size:19px; color:var(--muted); }
.actions{ display:flex; flex-wrap:wrap; gap:12px; }
.btn{ display:inline-flex; align-items:center; min-height:48px; padding:0 26px; border-radius:999px; font-weight:600; font-size:16px; }
.btn.primary{ background:var(--fg); color:var(--bg); }
.btn.ghost{ border:1px solid var(--muted); }
.btn.ghost:hover{ border-color:var(--fg); }

.tools{ position:absolute; z-index:7; left:max(24px,4.5vw); bottom:calc(24px + env(safe-area-inset-bottom,0px)); right:max(24px,4.5vw); display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; font-size:14px; color:var(--muted); pointer-events:none; }
.tools label{ pointer-events:auto; display:inline-flex; align-items:center; min-height:42px; padding:0 18px; border-radius:999px; border:1px solid var(--muted); color:var(--fg); font-weight:600; cursor:pointer; background:var(--bg); }
.tools label:hover{ border-color:var(--fg); }
.tools input{ position:absolute; width:1px; height:1px; opacity:0; }
.tools input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:6px; border-radius:999px; }

#end{ padding:110px max(24px,5vw) 140px; border-top:1px solid var(--line); }
#end h2{ margin:0 0 20px; font-size:clamp(28px,3.4vw,44px); letter-spacing:-0.03em; font-weight:800; }
#end .chips{ display:flex; flex-wrap:wrap; gap:10px; }
#end .chip{ border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-weight:600; font-size:15px; }

@media (max-width:820px){
  .copy{ align-items:flex-start; padding-top:calc(92px + env(safe-area-inset-top,0px)); }
  .copy-inner{ max-width:100%; }
  .copy h1{ font-size:clamp(34px,9.6vw,50px); margin-bottom:0; }
  .copy p, .copy .actions{ display:none; }
  .top nav a:not(.pill){ display:none; }
}
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
</style>
</head>
<body>

<main>
  <section class="stage" id="stage">
    <canvas id="c" aria-hidden="true"></canvas>

    <header class="top">
      <a class="brand" href="#top">Juan Perozo</a>
      <nav aria-label="Main">
        <a href="#end">Work</a>
        <a href="#end">About</a>
        <a class="pill" href="mailto:juandpp97@gmail.com">Contact</a>
      </nav>
    </header>

    <div class="copy">
      <div class="copy-inner">
        <h1>I design the product, then I build it.</h1>
        <p>Product Designer. Landing pages, admin panels and MVPs, built with Claude Code.</p>
        <div class="actions">
          <a class="btn primary" href="#end">View work</a>
          <a class="btn ghost" href="mailto:juandpp97@gmail.com">Contact me</a>
        </div>
      </div>
    </div>

    <div class="tools">
      <span id="status">Move over the portrait to see the person behind the interface.</span>
      <label><input type="file" id="file" accept="image/*"><span>Add my photo</span></label>
    </div>
  </section>

  <section id="end">
    <h2>Selected work</h2>
    <div class="chips">
      <span class="chip">[Fedes lead panel]</span>
      <span class="chip">[Project 2]</span>
      <span class="chip">[Project 3]</span>
    </div>
  </section>
</main>

<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d');
  var fileInput = document.getElementById('file');
  var statusEl = document.getElementById('status');

  function mk() { return document.createElement('canvas'); }
  var src = mk(), sx = src.getContext('2d');

  var W = 1, H = 1, dpr = 1, S = 18, cols = 1, rows = 1;
  var reg = { x: 0, y: 0, w: 1, h: 1, portrait: false };
  var amt = new Float32Array(1), hsh = new Float32Array(1);
  var ox = new Float32Array(1), oy = new Float32Array(1), vx = new Float32Array(1), vy = new Float32Array(1);
  var palette = null, userImg = null;

  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function smooth(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function h1(i) { var x = Math.sin(i * 127.1 + 3.7) * 43758.5453; return x - Math.floor(x); }

  function readPalette() {
    var cs = getComputedStyle(document.documentElement);
    function g(n) { return cs.getPropertyValue(n).trim(); }
    var bg = g('--bg'), lum = 0.5, m = /^#([0-9a-f]{6})$/i.exec(bg);
    if (m) { var v = parseInt(m[1], 16); lum = (((v >> 16) & 255) * 0.299 + ((v >> 8) & 255) * 0.587 + (v & 255) * 0.114) / 255; }
    palette = { bg: bg, fg: g('--fg'), acc: g('--accent'), dark: lum < 0.5 };
  }

  /* ---------- source image: demo figure or the user's photo ---------- */
  function paintDemo(c, sw, sh) {
    var g = c.createLinearGradient(0, 0, sw, sh);
    g.addColorStop(0, '#F5D2AE'); g.addColorStop(0.55, '#E9A47F'); g.addColorStop(1, '#86B4C4');
    c.fillStyle = g; c.fillRect(0, 0, sw, sh);
    var gl = c.createRadialGradient(sw * 0.5, sh * 0.3, 0, sw * 0.5, sh * 0.3, sw * 0.55);
    gl.addColorStop(0, 'rgba(255,244,214,0.95)'); gl.addColorStop(1, 'rgba(255,244,214,0)');
    c.fillStyle = gl; c.fillRect(0, 0, sw, sh);
    var m = Math.min(sw, sh * 0.95);
    c.save();
    c.shadowColor = 'rgba(30,14,10,0.6)'; c.shadowBlur = m * 0.06;
    c.fillStyle = '#2A1712';
    c.beginPath(); c.ellipse(sw * 0.5, sh * 1.0, m * 0.56, m * 0.4, 0, 0, 6.283); c.fill();
    c.fillRect(sw * 0.5 - m * 0.07, sh * 0.5, m * 0.14, m * 0.2);
    c.fillStyle = '#34201A';
    c.beginPath(); c.arc(sw * 0.5, sh * 0.4, m * 0.2, 0, 6.283); c.fill();
    c.restore();
    var rim = c.createRadialGradient(sw * 0.58, sh * 0.34, 0, sw * 0.58, sh * 0.34, m * 0.28);
    rim.addColorStop(0, 'rgba(255,150,60,0.55)'); rim.addColorStop(1, 'rgba(255,150,60,0)');
    c.fillStyle = rim; c.fillRect(0, 0, sw, sh);
  }
  function buildSource() {
    var sw = Math.max(2, Math.round(reg.w * dpr)), sh = Math.max(2, Math.round(reg.h * dpr));
    src.width = sw; src.height = sh;
    if (userImg) {
      var ir = userImg.width / userImg.height, tr = sw / sh, a, b, cx, cy;
      if (ir > tr) { b = userImg.height; a = b * tr; cx = (userImg.width - a) / 2; cy = 0; }
      else { a = userImg.width; b = a / tr; cx = 0; cy = (userImg.height - b) / 2; }
      sx.drawImage(userImg, cx, cy, a, b, 0, 0, sw, sh);
    } else { paintDemo(sx, sw, sh); }
  }
  function downscale(from, tw, th) {
    var c = from;
    while (c.width / 2 >= tw * 1.5 || c.height / 2 >= th * 1.5) {
      var n = mk();
      n.width = Math.max(tw, Math.floor(c.width / 2)); n.height = Math.max(th, Math.floor(c.height / 2));
      n.getContext('2d').drawImage(c, 0, 0, n.width, n.height);
      c = n;
    }
    var f = mk(); f.width = tw; f.height = th;
    f.getContext('2d').drawImage(c, 0, 0, tw, th);
    return f;
  }
  function sampleGrid() {
    cols = Math.ceil(reg.w / S); rows = Math.ceil(reg.h / S);
    var small = downscale(src, cols, rows);
    var d = small.getContext('2d').getImageData(0, 0, cols, rows).data;
    var n = cols * rows;
    amt = new Float32Array(n); hsh = new Float32Array(n);
    ox = new Float32Array(n); oy = new Float32Array(n); vx = new Float32Array(n); vy = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var lum = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
      var a = palette.dark ? lum : 1 - lum;
      a = Math.pow(clamp((a - 0.1) * 1.4, 0, 1), 1.05);
      var cxp = (i % cols + 0.5) * S, cyp = (Math.floor(i / cols) + 0.5) * S;
      a *= reg.portrait ? smooth(0, 0.14, cyp / reg.h) : smooth(0, 0.16, cxp / reg.w);
      amt[i] = a; hsh[i] = h1(i);
    }
  }

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  /* ---------- layout ---------- */
  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    var p = W / H < 0.95;
    if (!p) reg = { x: W * 0.36, y: 0, w: W * 0.64, h: H, portrait: false };
    else reg = { x: 0, y: H * 0.3, w: W, h: H * 0.7, portrait: true };
    S = clamp(Math.round(Math.min(W, H) / 46), 10, 22);
    readPalette();
    buildSource();
    sampleGrid();
  }

  /* ---------- interaction ---------- */
  var ptr = { x: 0, y: 0, inside: false, seen: false, last: 0 };
  var lens = { x: 0, y: 0, r: 0 };
  var burst = 0, pushImpulse = null;

  function local(e) { var r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, ok: e.clientY >= r.top && e.clientY <= r.bottom }; }
  function inReg(x, y) { return x >= reg.x && x <= reg.x + reg.w && y >= reg.y && y <= reg.y + reg.h; }
  window.addEventListener('pointermove', function (e) {
    var p = local(e);
    if (!p.ok) { ptr.inside = false; return; }
    ptr.x = p.x; ptr.y = p.y; ptr.inside = inReg(p.x, p.y); ptr.seen = true; ptr.last = performance.now();
  }, { passive: true });
  stage.addEventListener('pointerleave', function () { ptr.inside = false; });
  stage.addEventListener('pointerdown', function (e) {
    var p = local(e);
    ptr.x = p.x; ptr.y = p.y; ptr.inside = inReg(p.x, p.y); ptr.seen = true; ptr.last = performance.now();
    if (ptr.inside && !e.target.closest('a,label,input')) { burst = 1; pushImpulse = { x: p.x, y: p.y }; }
  });

  function loadFile(f) {
    if (!f || f.type.indexOf('image/') !== 0) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        userImg = img; buildSource(); sampleGrid();
        statusEl.textContent = 'That is you. Move over the portrait to reveal the photo.';
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  }
  fileInput.addEventListener('change', function () { loadFile(fileInput.files && fileInput.files[0]); });
  stage.addEventListener('dragover', function (e) { e.preventDefault(); });
  stage.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  /* ---------- draw ---------- */
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var fg = palette.fg, acc = palette.acc, bg = palette.bg;
    var lr = lens.r, lx = lens.x, ly = lens.y;
    var n = cols * rows, i;
    ctx.lineWidth = 1.3;
    for (i = 0; i < n; i++) {
      var a = amt[i];
      if (a < 0.09) continue;
      var c0 = i % cols, r0 = (i / cols) | 0;
      var px = reg.x + (c0 + 0.5) * S + ox[i], py = reg.y + (r0 + 0.5) * S + oy[i];
      var sc = 1;
      if (lr > 1) {
        var dx = px - lx, dy = py - ly, d = Math.sqrt(dx * dx + dy * dy);
        if (d < lr - S * 0.5) continue;
        if (d < lr * 1.6) sc = 1 + 0.3 * (1 - d / (lr * 1.6));
      }
      var u = S * sc, hh = hsh[i];
      var col = hh < 0.07 ? acc : fg;
      ctx.fillStyle = col; ctx.strokeStyle = col;
      ctx.globalAlpha = 0.3 + 0.7 * a;
      if (a < 0.2) {
        ctx.beginPath(); ctx.arc(px, py, u * 0.13, 0, 6.283); ctx.fill();
      } else if (a < 0.38) {
        if (hh > 0.8) rr(ctx, px - u * 0.07, py - u * 0.36, u * 0.14, u * 0.72, u * 0.07);
        else rr(ctx, px - u * 0.38, py - u * 0.07, u * 0.76, u * 0.14, u * 0.07);
        ctx.fill();
      } else if (a < 0.55) {
        rr(ctx, px - u * 0.38, py - u * 0.17, u * 0.76, u * 0.34, u * 0.17); ctx.stroke();
      } else if (a < 0.72) {
        rr(ctx, px - u * 0.38, py - u * 0.18, u * 0.76, u * 0.36, u * 0.18); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(px + (hh > 0.5 ? u * 0.2 : -u * 0.2), py, u * 0.11, 0, 6.283); ctx.fill();
      } else if (a < 0.88) {
        rr(ctx, px - u * 0.37, py - u * 0.37, u * 0.74, u * 0.74, u * 0.16); ctx.fill();
        ctx.globalAlpha = 0.85; ctx.fillStyle = bg;
        rr(ctx, px - u * 0.22, py - u * 0.05, u * 0.44, u * 0.1, u * 0.05); ctx.fill();
      } else {
        rr(ctx, px - u * 0.44, py - u * 0.44, u * 0.88, u * 0.88, u * 0.22); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (lr > 1) {
      ctx.save();
      ctx.beginPath(); ctx.arc(lx, ly, lr, 0, 6.283); ctx.clip();
      ctx.drawImage(src, reg.x, reg.y, reg.w, reg.h);
      ctx.restore();
      ctx.lineWidth = 1.5; ctx.strokeStyle = fg;
      ctx.beginPath(); ctx.arc(lx, ly, lr, 0, 6.283); ctx.stroke();
    }
  }

  /* ---------- loop ---------- */
  var prev = performance.now(), startT = prev;
  function frame(now) {
    var dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;
    var R = clamp(Math.min(W, H) * 0.16, 70, 170);
    var idle = !ptr.seen || (now - ptr.last > 3500);
    var tx = lens.x, ty = lens.y, tr = 0;
    if (ptr.inside && !idle) { tx = ptr.x; ty = ptr.y; tr = R; }
    else if (idle && !reduce) {
      var t = (now - startT) / 1000;
      tx = reg.x + reg.w * (0.5 + 0.2 * Math.sin(t * 0.6));
      ty = reg.y + reg.h * (0.42 + 0.16 * Math.sin(t * 0.9 + 1));
      tr = R * 0.85;
    }
    burst *= Math.exp(-dt * 2.2);
    tr *= 1 + burst * 1.2;
    var k = reduce ? 1 : 1 - Math.exp(-dt * 9);
    if (lens.r < 2 && tr > 0) { lens.x = tx; lens.y = ty; }
    lens.x += (tx - lens.x) * k; lens.y += (ty - lens.y) * k;
    lens.r += (tr - lens.r) * (reduce ? 1 : 1 - Math.exp(-dt * 8));
    lens.x = clamp(lens.x, reg.x + lens.r * 0.4, reg.x + reg.w);

    if (!reduce) {
      var n = cols * rows, i, pr = R * 1.3;
      var px0 = ptr.inside && !idle ? ptr.x : null, py0 = ptr.y;
      var hasImp = pushImpulse;
      for (i = 0; i < n; i++) {
        var c0 = i % cols, r0 = (i / cols) | 0;
        var cx = reg.x + (c0 + 0.5) * S, cy = reg.y + (r0 + 0.5) * S;
        var fx = 0, fy = 0;
        if (px0 !== null) {
          var dx = cx + ox[i] - px0, dy = cy + oy[i] - py0, d2 = dx * dx + dy * dy;
          if (d2 < pr * pr && d2 > 0.01) { var d = Math.sqrt(d2), f = Math.pow(1 - d / pr, 2) * 2.2; fx += dx / d * f; fy += dy / d * f; }
        }
        if (hasImp) {
          var ex = cx - hasImp.x, ey = cy - hasImp.y, e2 = ex * ex + ey * ey, er = R * 2.4;
          if (e2 < er * er && e2 > 0.01) { var ed = Math.sqrt(e2), ef = (1 - ed / er) * 14; fx += ex / ed * ef; fy += ey / ed * ef; }
        }
        vx[i] = (vx[i] + fx - ox[i] * 0.07) * 0.86; vy[i] = (vy[i] + fy - oy[i] * 0.07) * 0.86;
        ox[i] += vx[i]; oy[i] += vy[i];
      }
      pushImpulse = null;
    }
    draw();
    requestAnimationFrame(frame);
  }

  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 140); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { readPalette(); sampleGrid(); });
  }
  new MutationObserver(function () { readPalette(); sampleGrid(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function begin() { resize(); prev = performance.now(); startT = prev; requestAnimationFrame(frame); }
  if (document.fonts && document.fonts.load) {
    Promise.race([document.fonts.load('800 40px "Hanken Grotesk"'), new Promise(function (r) { setTimeout(r, 1200); })]).then(begin, begin);
  } else { begin(); }
})();
</script>
</body>
</html>
