<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juan Perozo · Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#4A4A4A; --line:#E3E3E3; --accent:#B5381C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E0F12; --fg:#F4F4F5; --muted:#B5B7BD; --line:#2A2C31; --accent:#FF8A5C; }
}
:root[data-theme="dark"]{ --bg:#0E0F12; --fg:#F4F4F5; --muted:#B5B7BD; --line:#2A2C31; --accent:#FF8A5C; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2px solid #FFFFFF; outline-offset:3px; border-radius:8px; }

.stage{ position:relative; height:100vh; height:100svh; min-height:560px; overflow:hidden; color:#FFFFFF;
  background:radial-gradient(60% 60% at 62% 45%, #E9893B 0%, rgba(233,137,59,0) 70%), linear-gradient(100deg,#2F6C80 0%,#5D95A8 38%,#B58FA0 72%,#8E5C6B 100%); }
canvas#bg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
canvas[hidden]{ display:none; }

.top{ position:absolute; z-index:6; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; gap:16px;
  padding:calc(26px + env(safe-area-inset-top,0px)) max(24px,4.5vw) 0; }
.brand{ font-size:clamp(30px,3.4vw,50px); font-weight:500; letter-spacing:-0.045em; line-height:1; }
.top nav{ display:flex; align-items:center; gap:28px; font-size:15px; font-weight:500; }
.top nav a:hover{ opacity:.75; }
.cta{ display:inline-flex; align-items:center; gap:12px; background:#B5381C; color:#FFFFFF; border-radius:999px; padding:6px 6px 6px 20px; font-weight:600; font-size:15px; min-height:46px; }
.cta:hover{ opacity:1 !important; background:#9E2F16; }
.cta .dot{ width:34px; height:34px; border-radius:50%; background:#FFFFFF; color:#B5381C; display:grid; place-items:center; }

.serif{ position:absolute; z-index:5; right:max(24px,6vw); top:50%; transform:translateY(-38%); text-align:right; margin:0;
  font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:400; font-size:clamp(46px,6.6vw,108px); line-height:.94; letter-spacing:-0.015em; }
.serif span{ display:block; }
.serif .warm{ color:#FFB27A; }

.blurb{ position:absolute; z-index:5; left:max(24px,6vw); bottom:30%; max-width:330px; margin:0; font-size:17px; line-height:1.5; }

.word{ position:absolute; z-index:4; left:max(12px,3.2vw); right:0; bottom:-0.07em; margin:0; font-weight:600; font-size:clamp(120px,25vw,520px); line-height:.82; letter-spacing:-0.065em; white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; user-select:none; }

.tools{ position:absolute; z-index:7; right:max(24px,4.5vw); bottom:calc(20px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:14px; font-size:14px; }
.tools .hint{ opacity:.9; text-shadow:0 1px 10px rgba(0,0,0,.35); }
.tools label{ display:inline-flex; align-items:center; min-height:40px; padding:0 16px; border-radius:999px; background:rgba(0,0,0,.34); border:1px solid rgba(255,255,255,.35); cursor:pointer; font-weight:600; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.tools label:hover{ background:rgba(0,0,0,.5); }
.tools input{ position:absolute; width:1px; height:1px; opacity:0; }
.tools input:focus-visible + span{ outline:2px solid #FFFFFF; outline-offset:6px; border-radius:999px; }

#end{ padding:110px max(24px,5vw) 140px; }
#end h2{ margin:0 0 20px; font-size:clamp(28px,3.4vw,44px); letter-spacing:-0.03em; font-weight:700; }
#end .chips{ display:flex; flex-wrap:wrap; gap:10px; }
#end .chip{ border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-weight:600; font-size:15px; }

@keyframes rise{ from{ opacity:0; transform:translateY(28px); } to{ opacity:1; transform:none; } }
@keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
.serif span{ animation:rise 1s cubic-bezier(.2,.8,.2,1) both; }
.serif span:nth-child(2){ animation-delay:.12s; }
.serif span:nth-child(3){ animation-delay:.24s; }
.word{ animation:fadein 1.6s .2s ease both; }
.blurb{ animation:fadein 1.2s .5s ease both; }

@media (max-width:820px){
  .top nav a:not(.cta){ display:none; }
  .serif{ right:auto; left:max(24px,6vw); text-align:left; top:calc(110px + env(safe-area-inset-top,0px)); transform:none; font-size:clamp(44px,14vw,76px); }
  .blurb{ bottom:26%; max-width:78%; font-size:16px; }
  .tools .hint{ display:none; }
  .tools{ left:max(24px,4.5vw); right:auto; }
}
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  .serif span,.word,.blurb{ animation:none; }
}
</style>
</head>
<body>

<main>
  <section class="stage" id="stage">
    <canvas id="bg" aria-hidden="true"></canvas>

    <header class="top">
      <a class="brand" href="#top">Juan Perozo</a>
      <nav aria-label="Main">
        <a href="#end">About</a>
        <a href="#end">Work</a>
        <a href="mailto:juandpp97@gmail.com">Contact</a>
        <a class="cta" href="mailto:juandpp97@gmail.com">Let's talk <span class="dot" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
      </nav>
    </header>

    <h1 class="serif"><span>Product</span><span>Designer</span><span class="warm">&amp; builder</span></h1>

    <p class="blurb">I design digital products and help decide what's worth building. Landing pages, admin panels and MVPs, made with Claude Code.</p>

    <div class="word" id="word" aria-hidden="true">Perozo</div>

    <div class="tools">
      <span class="hint">Move your cursor to smear the light.</span>
      <label><input type="file" id="file" accept="image/*"><span>Try it with my photo</span></label>
    </div>
  </section>

  <section id="end">
    <h2>Selected work</h2>
    <div class="chips">
      <span class="chip">[Fedes lead panel]</span>
      <span class="chip">[Project 2]</span>
      <span class="chip">[Project 3]</span>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('bg');
  var fileInput = document.getElementById('file');

  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }

  /* ---------- source texture: procedural "long exposure" scene, or the user's own photo ---------- */
  var TW = 1600, TH = 1000;
  var texC = document.createElement('canvas');
  texC.width = TW; texC.height = TH;
  var t = texC.getContext('2d');

  function paintProcedural() {
    var g = t.createLinearGradient(0, 0, TW, 0);
    g.addColorStop(0, '#2F6C80'); g.addColorStop(0.35, '#5D95A8');
    g.addColorStop(0.7, '#B58FA0'); g.addColorStop(1, '#8E5C6B');
    t.fillStyle = g; t.fillRect(0, 0, TW, TH);

    function glow(x, y, r, c0, c1) {
      var rg = t.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, c0); rg.addColorStop(1, c1);
      t.fillStyle = rg; t.fillRect(x - r, y - r, r * 2, r * 2);
    }
    glow(TW * 0.62, TH * 0.42, TW * 0.34, 'rgba(255,170,70,0.95)', 'rgba(255,120,40,0)');
    glow(TW * 0.55, TH * 0.3, TW * 0.17, 'rgba(255,230,160,0.95)', 'rgba(255,226,150,0)');
    glow(TW * 0.86, TH * 0.78, TW * 0.22, 'rgba(255,150,90,0.55)', 'rgba(255,150,90,0)');

    t.save();
    t.shadowColor = 'rgba(24,12,10,0.95)'; t.shadowBlur = 110;
    t.fillStyle = 'rgba(24,12,10,0.94)';
    t.translate(TW * 0.62, TH * 0.74); t.rotate(-0.38);
    t.beginPath(); t.ellipse(0, 0, TW * 0.28, TH * 0.2, 0, 0, 6.283); t.fill();
    t.restore();
    t.save();
    t.shadowColor = 'rgba(24,12,10,0.9)'; t.shadowBlur = 80;
    t.fillStyle = 'rgba(30,14,12,0.92)';
    t.beginPath(); t.arc(TW * 0.47, TH * 0.2, TW * 0.075, 0, 6.283); t.fill();
    t.restore();
    glow(TW * 0.56, TH * 0.56, TW * 0.2, 'rgba(255,140,50,0.7)', 'rgba(255,140,50,0)');
  }

  function paintImage(img) {
    var ir = img.width / img.height, tr = TW / TH, sw, sh, sx, sy;
    if (ir > tr) { sh = img.height; sw = sh * tr; sx = (img.width - sw) / 2; sy = 0; }
    else { sw = img.width; sh = sw / tr; sx = 0; sy = (img.height - sh) / 2; }
    t.clearRect(0, 0, TW, TH);
    t.drawImage(img, sx, sy, sw, sh, 0, 0, TW, TH);
  }

  paintProcedural();

  /* ---------- WebGL: directional blur along cursor velocity ---------- */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
  } catch (e) {
    canvas.hidden = true;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));

  var scene = new THREE.Scene();
  var cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var tex = new THREE.CanvasTexture(texC);
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  var uniforms = {
    uTex: { value: tex },
    uDir: { value: new THREE.Vector2(0.04, 0.012) },
    uScale: { value: new THREE.Vector2(1, 1) },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 }
  };
  var mat = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: [
      'uniform sampler2D uTex; uniform vec2 uDir; uniform vec2 uScale; uniform vec2 uRes; uniform float uTime;',
      'varying vec2 vUv;',
      'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }',
      'void main(){',
      '  vec2 uv = (vUv - 0.5) * uScale + 0.5;',
      '  vec2 w = vec2(sin(vUv.y*5.0 + uTime*0.4), cos(vUv.x*4.0 + uTime*0.3)) * 0.008;',
      '  vec3 acc = vec3(0.0); float ws = 0.0;',
      '  for (int i = 0; i < 28; i++) {',
      '    float s = float(i) / 27.0 - 0.5;',
      '    float wt = exp(-s*s*6.0);',
      '    vec2 p = uv + w*uScale + uDir*uScale*s;',
      '    acc += texture2D(uTex, clamp(p, 0.001, 0.999)).rgb * wt; ws += wt;',
      '  }',
      '  vec3 col = acc / ws;',
      '  float vig = smoothstep(1.25, 0.25, length(vUv - 0.5));',
      '  col *= mix(0.8, 1.0, vig);',
      '  col += (hash(vUv*uRes + uTime) - 0.5) * 0.05;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

  var W = 1, H = 1;
  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    renderer.setSize(W, H, false);
    var sa = W / H, ia = TW / TH;
    if (sa > ia) uniforms.uScale.value.set(1, ia / sa);
    else uniforms.uScale.value.set(sa / ia, 1);
    uniforms.uRes.value.set(W, H);
  }
  resize();
  window.addEventListener('resize', resize);

  var impulse = { x: 0, y: 0 }, vel = { x: 0, y: 0 }, last = null;
  window.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom) { last = null; return; }
    if (last) {
      impulse.x += ((e.clientX - last.x) / W) * 2.4;
      impulse.y += (-(e.clientY - last.y) / H) * 2.4;
    }
    last = { x: e.clientX, y: e.clientY };
  }, { passive: true });
  stage.addEventListener('pointerleave', function () { last = null; });
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('a,label,input')) return;
    var a = Math.random() * 6.283;
    vel.x += Math.cos(a) * 0.14; vel.y += Math.sin(a) * 0.14;
  });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f || f.type.indexOf('image/') !== 0) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () { paintImage(img); tex.needsUpdate = true; };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });

  var prev = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;
    var time = reduce ? 1.5 : now / 1000;
    vel.x += impulse.x; vel.y += impulse.y; impulse.x = 0; impulse.y = 0;
    vel.x *= Math.exp(-dt * 3.2); vel.y *= Math.exp(-dt * 3.2);
    var drift = reduce ? 0 : 1;
    var bx = (0.04 + Math.cos(time * 0.3) * 0.012) * drift;
    var by = (0.012 + Math.sin(time * 0.23) * 0.01) * drift;
    var dx = bx + vel.x, dy = by + vel.y;
    var len = Math.sqrt(dx * dx + dy * dy), max = 0.2;
    if (len > max) { dx *= max / len; dy *= max / len; }
    uniforms.uDir.value.set(dx, dy);
    uniforms.uTime.value = time;
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
