<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juan Perozo · Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#4A4A4A; --line:#E3E3E3; --accent:#2A3FFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E0F12; --fg:#F4F4F5; --muted:#B5B7BD; --line:#2A2C31; --accent:#8C9BFF; }
}
:root[data-theme="dark"]{ --bg:#0E0F12; --fg:#F4F4F5; --muted:#B5B7BD; --line:#2A2C31; --accent:#8C9BFF; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

.top{ position:fixed; top:0; left:0; right:0; z-index:20; display:flex; justify-content:space-between; align-items:center; gap:16px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,5vw) 20px; }
.top .brand{ font-weight:700; font-size:18px; letter-spacing:-0.01em; }
.top nav{ display:flex; gap:24px; align-items:center; font-size:15px; font-weight:500; }
.progress{ position:fixed; top:0; left:0; height:2px; width:0; background:var(--accent); z-index:30; }

.scroller{ position:relative; height:260vh; }
.stage{ position:sticky; top:0; height:100vh; height:100svh; overflow:hidden; touch-action:pan-y; }

.name{ position:absolute; left:0; right:0; top:50%; margin:0; transform:translateY(-54%); text-align:center; white-space:nowrap;
  font-size:clamp(72px,15.5vw,320px); line-height:.85; letter-spacing:-0.055em; font-weight:800; color:var(--fg); z-index:1; will-change:opacity; }
.shadow{ position:absolute; left:0; top:0; width:0; height:0; z-index:2; pointer-events:none;
  background:radial-gradient(closest-side, rgba(0,0,0,.28), rgba(0,0,0,0)); filter:blur(14px); will-change:transform; }
canvas#gl{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:3; }
canvas[hidden]{ display:none; }
.blob{ position:absolute; z-index:3; left:50%; top:50%; width:min(46vw,44svh); aspect-ratio:1; transform:translate(-50%,-50%);
  border-radius:48% 52% 55% 45% / 50% 45% 55% 50%; background:radial-gradient(circle at 35% 30%, #fff, var(--accent) 55%, #0b1050 100%);
  animation:morph 9s ease-in-out infinite alternate; }
.blob[hidden]{ display:none; }
@keyframes morph{ to{ border-radius:55% 45% 45% 55% / 45% 55% 45% 55%; transform:translate(-50%,-50%) rotate(25deg); } }

.intro{ position:absolute; z-index:4; left:max(24px,5vw); bottom:calc(36px + env(safe-area-inset-bottom,0px)); max-width:360px; }
.intro .role{ margin:0 0 4px; font-weight:700; font-size:20px; letter-spacing:-0.01em; }
.intro .sub{ margin:0; color:var(--muted); font-size:16px; }
.hint{ position:absolute; z-index:4; right:max(24px,5vw); bottom:calc(36px + env(safe-area-inset-bottom,0px)); font-size:14px; color:var(--muted); text-align:right; max-width:240px; }

.statement{ position:absolute; z-index:5; inset:0; display:flex; align-items:center; padding:0 max(24px,5vw); opacity:0; pointer-events:none; }
.statement-inner{ max-width:min(560px,46vw); }
.statement .big{ margin:0 0 28px; font-size:clamp(34px,4.6vw,66px); line-height:1.04; letter-spacing:-0.035em; font-weight:700; }
.actions{ display:flex; flex-wrap:wrap; gap:12px; }
.btn{ display:inline-flex; align-items:center; min-height:48px; padding:0 26px; border-radius:999px; font-weight:600; font-size:16px; }
.btn.primary{ background:var(--fg); color:var(--bg); }
.btn.ghost{ border:1px solid var(--line); color:var(--fg); background:var(--bg); }
.btn.ghost:hover{ border-color:var(--fg); }

#end{ position:absolute; bottom:0; left:0; width:1px; height:1px; }

@media (max-width:820px){
  .statement{ align-items:flex-end; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px)); }
  .statement-inner{ max-width:100%; }
  .statement .big{ font-size:clamp(28px,8vw,40px); }
  .top nav a:not(.cta){ display:none; }
  .hint{ display:none; }
}
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  .blob{ animation:none; }
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#top">Juan Perozo</a>
  <nav aria-label="Main">
    <a href="#end">Work</a>
    <a href="mailto:juandpp97@gmail.com" class="cta">Contact</a>
  </nav>
</header>
<div class="progress" id="bar" aria-hidden="true"></div>

<main class="scroller" id="scroller">
  <div class="stage" id="stage">
    <h1 class="name" id="name">Juan Perozo</h1>
    <div class="shadow" id="shadow" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="blob" id="blob" hidden aria-hidden="true"></div>

    <div class="intro" id="intro">
      <p class="role">Product Designer</p>
      <p class="sub">Landing pages, admin panels and MVPs, built with Claude Code.</p>
    </div>
    <div class="hint" id="hint">Move your cursor over the object. Click it to make it ripple.</div>

    <div class="statement" id="statement">
      <div class="statement-inner">
        <p class="big">I design digital products and help decide what's worth building.</p>
        <div class="actions">
          <a class="btn primary" href="#end">View work</a>
          <a class="btn ghost" href="mailto:juandpp97@gmail.com">Contact me</a>
        </div>
      </div>
    </div>
  </div>
  <div id="end"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('gl');
  var stage = document.getElementById('stage');
  var scroller = document.getElementById('scroller');
  var nameEl = document.getElementById('name');
  var shadow = document.getElementById('shadow');
  var intro = document.getElementById('intro');
  var hint = document.getElementById('hint');
  var statement = document.getElementById('statement');
  var blob = document.getElementById('blob');
  var bar = document.getElementById('bar');

  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function smooth(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function progress() {
    var max = scroller.offsetHeight - window.innerHeight;
    return max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
  }

  function updateOverlay(ps) {
    var e = smooth(0.12, 0.6, ps);
    nameEl.style.opacity = String(lerp(1, 0.07, e));
    intro.style.opacity = String(1 - smooth(0.02, 0.18, ps));
    hint.style.opacity = String(1 - smooth(0.02, 0.1, ps));
    var s = smooth(0.4, 0.7, ps);
    statement.style.opacity = String(s);
    statement.style.pointerEvents = 'none';
    var inner = statement.firstElementChild;
    inner.style.pointerEvents = s > 0.5 ? 'auto' : 'none';
    inner.style.transform = 'translateY(' + ((1 - s) * 24) + 'px)';
    bar.style.width = (ps * 100) + '%';
  }

  function fallback() {
    canvas.hidden = true;
    blob.hidden = false;
    shadow.style.display = 'none';
    window.addEventListener('scroll', function () { updateOverlay(progress()); }, { passive: true });
    updateOverlay(progress());
  }

  var VERT = [
    'uniform float uTime;',
    'uniform float uAmp;',
    'uniform vec3 uPoint;',
    'uniform float uBump;',
    'uniform float uPulse;',
    'varying vec3 vN;',
    'varying vec3 vView;',
    'float disp(vec3 p){',
    '  float t = uTime;',
    '  float d = 0.0;',
    '  d += sin(p.x*2.1 + t*0.8) * sin(p.y*1.7 - t*0.6) * 0.5;',
    '  d += sin(dot(p, vec3(0.6,0.5,-0.6))*3.3 + t*1.1) * 0.28;',
    '  d += sin(dot(p, vec3(-0.4,0.7,0.5))*5.1 - t*0.9) * 0.14;',
    '  d *= uAmp;',
    '  float k = max(dot(p, uPoint), 0.0);',
    '  d += uBump * pow(k, 6.0) * 0.5;',
    '  d += uPulse * sin(dot(p, uPoint)*9.0 - t*6.0) * 0.14 * pow(k, 2.0);',
    '  return d;',
    '}',
    'vec3 shape(vec3 p){ return p * (1.5 + disp(p)); }',
    'void main(){',
    '  vec3 p = normalize(position);',
    '  vec3 up = abs(p.y) > 0.95 ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);',
    '  vec3 t1 = normalize(cross(up, p));',
    '  vec3 t2 = cross(p, t1);',
    '  float e = 0.02;',
    '  vec3 p0 = shape(p);',
    '  vec3 p1 = shape(normalize(p + t1*e));',
    '  vec3 p2 = shape(normalize(p + t2*e));',
    '  vec3 n = normalize(cross(p1 - p0, p2 - p0));',
    '  if (dot(n, p) < 0.0) n = -n;',
    '  vN = normalize(normalMatrix * n);',
    '  vec4 mv = modelViewMatrix * vec4(p0, 1.0);',
    '  vView = -mv.xyz;',
    '  gl_Position = projectionMatrix * mv;',
    '}'
  ].join('\n');

  var FRAG = [
    'uniform vec3 uAccent;',
    'varying vec3 vN;',
    'varying vec3 vView;',
    'vec3 env(vec3 r){',
    '  float y = r.y*0.5 + 0.5;',
    '  vec3 base = mix(vec3(0.035,0.04,0.07), vec3(0.93,0.94,0.98), smoothstep(0.12,0.95,y));',
    '  float l1 = pow(max(dot(r, normalize(vec3(0.6,0.7,0.5))), 0.0), 14.0);',
    '  float l2 = pow(max(dot(r, normalize(vec3(-0.8,0.2,0.4))), 0.0), 10.0);',
    '  float a1 = pow(max(dot(r, normalize(vec3(-0.2,-0.7,0.6))), 0.0), 3.0);',
    '  float a2 = pow(max(dot(r, normalize(vec3(0.8,-0.3,0.3))), 0.0), 5.0);',
    '  vec3 c = base + vec3(1.0)*l1*1.4 + vec3(0.8,0.85,1.0)*l2*0.7 + uAccent*a1*1.5 + uAccent*a2*0.9;',
    '  c *= 0.86 + 0.14*sin(r.y*14.0 + r.x*4.0);',
    '  return c;',
    '}',
    'void main(){',
    '  vec3 n = normalize(vN);',
    '  vec3 v = normalize(vView);',
    '  vec3 r = reflect(-v, n);',
    '  float fr = pow(1.0 - max(dot(n, v), 0.0), 3.0);',
    '  vec3 col = env(r);',
    '  col = mix(col, uAccent*1.15, fr*0.5);',
    '  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
    '}'
  ].join('\n');

  function start() {
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    } catch (err) {
      fallback();
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setClearColor(0x000000, 0);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 0, 8);

    var uniforms = {
      uTime: { value: 0 },
      uAmp: { value: 1 },
      uPoint: { value: new THREE.Vector3(0, 0, 1) },
      uBump: { value: 0 },
      uPulse: { value: 0 },
      uAccent: { value: new THREE.Color('#2A3FFF') }
    };
    var mat = new THREE.ShaderMaterial({ uniforms: uniforms, vertexShader: VERT, fragmentShader: FRAG });
    var mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 36), mat);
    scene.add(mesh);

    var vis = { s0: 1, s1: 0.7, x1: 2.7, y0: 0, y1: 0 };
    var halfH = Math.tan((35 * Math.PI / 180) / 2) * 8;
    var halfW = halfH;
    var W = 1, H = 1;

    function layout() {
      W = stage.clientWidth; H = stage.clientHeight;
      renderer.setSize(W, H, false);
      camera.aspect = W / H;
      halfW = halfH * camera.aspect;
      var portrait = W / H < 0.9;
      vis.s0 = portrait ? 0.52 : 1.0;
      vis.s1 = portrait ? 0.42 : 0.7;
      vis.x1 = portrait ? 0 : halfW * 0.52;
      vis.y0 = portrait ? -0.2 : 0;
      vis.y1 = portrait ? 1.7 : 0;
      camera.updateProjectionMatrix();
    }
    layout();
    window.addEventListener('resize', layout);

    var pointer = { x: 0, y: 0, active: false, last: 0 };
    var pulse = 0;
    var center = { px: 0, py: 0, rpx: 100 };

    window.addEventListener('pointermove', function (e) {
      var r = stage.getBoundingClientRect();
      pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -(((e.clientY - r.top) / r.height) * 2 - 1);
      pointer.active = true;
      pointer.last = performance.now();
    }, { passive: true });
    stage.addEventListener('pointerdown', function (e) {
      var r = stage.getBoundingClientRect();
      var dx = e.clientX - r.left - center.px;
      var dy = e.clientY - r.top - center.py;
      if (Math.sqrt(dx * dx + dy * dy) < center.rpx * 1.25) pulse = 1;
    });

    var ps = 0, last = performance.now(), rotX = 0, rotY = 0, bump = 0;
    var tmp = new THREE.Vector3();
    var inv = new THREE.Quaternion();

    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      var target = progress();
      ps += (target - ps) * (reduce ? 1 : 1 - Math.exp(-dt * 7));
      var e = smooth(0, 0.6, ps);

      var s = lerp(vis.s0, vis.s1, e);
      var px = lerp(0, vis.x1, e);
      var py = lerp(vis.y0, vis.y1, e);
      mesh.scale.set(s, s, s);
      mesh.position.set(px, py, 0);

      var k = reduce ? 1 : 1 - Math.exp(-dt * 6);
      var idle = (now - pointer.last) > 2500;
      var tx = (pointer.active && !idle) ? pointer.x : 0;
      var ty = (pointer.active && !idle) ? pointer.y : 0;
      if (!reduce) {
        rotY += (tx * 0.5 - rotY) * k;
        rotX += (-ty * 0.35 - rotX) * k;
        mesh.rotation.set(rotX, rotY + now / 1000 * 0.12, 0);
      }

      var wx = tx * halfW, wy = ty * halfH;
      var rad = 1.6 * s;
      var ox = (wx - px) / rad, oy = (wy - py) / rad;
      var dist = Math.sqrt(ox * ox + oy * oy);
      var l = Math.min(1, dist);
      tmp.set(dist > 0 ? ox / Math.max(1, dist) : 0, dist > 0 ? oy / Math.max(1, dist) : 0, Math.sqrt(Math.max(0, 1 - l * l)));
      tmp.normalize();
      inv.copy(mesh.quaternion).invert();
      tmp.applyQuaternion(inv);
      uniforms.uPoint.value.copy(tmp);
      var bumpTarget = (pointer.active && !idle && !reduce) ? 1 - smooth(1.0, 2.2, dist) : 0;
      bump += (bumpTarget - bump) * k;
      uniforms.uBump.value = bump;

      pulse *= Math.exp(-dt * 1.7);
      uniforms.uPulse.value = pulse;
      uniforms.uAmp.value = lerp(1.0, 1.3, e) + pulse * 0.35;
      uniforms.uTime.value = reduce ? 1.5 : now / 1000;

      var sy = (py / halfH) * (H / 2);
      var sx = (px / halfH) * (H / 2);
      center.px = W / 2 + sx;
      center.py = H / 2 - sy;
      center.rpx = (rad / halfH) * (H / 2);
      var sw = center.rpx * 1.5, sh = center.rpx * 0.34;
      shadow.style.width = sw * 2 + 'px';
      shadow.style.height = sh * 2 + 'px';
      shadow.style.transform = 'translate(' + (center.px - sw) + 'px,' + (center.py + center.rpx * 1.12 - sh) + 'px)';

      updateOverlay(ps);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function build() {
    if (typeof THREE === 'undefined') { fallback(); return; }
    start();
  }
  if (document.fonts && document.fonts.ready) {
    Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1200); })]).then(build, build);
  } else {
    build();
  }
})();
</script>
</body>
</html>
